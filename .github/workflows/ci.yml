name: CI - Shell & Python Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          severity: warning
          ignore: init_server.sh,deploy.sh,backup.sh

      - name: Check bash syntax
        run: |
          for f in *.sh; do
            echo "Checking $f ..."
            bash -n "$f" && echo "  ✅ $f syntax OK"
          done

      - name: Check docker-compose syntax
        run: |
          docker compose -f docker-compose.yml config --quiet 2>/dev/null && echo "✅ docker-compose.yml OK" || echo "⚠️  docker-compose.yml (Docker not available, skip)"

  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check Python syntax
        run: python -m py_compile health_check.py && echo "✅ health_check.py syntax OK"

      - name: Run ruff lint
        run: |
          pip install ruff
          ruff check health_check.py || echo "⚠️  Lint issues found"
